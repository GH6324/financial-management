<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('仪表盘 · 家庭账房')}"></head>
<body class="min-h-screen relative">
<script th:src="@{/vendor/chart.umd.min.js(v=${buildVersion})}"></script>
<script th:src="@{/vendor/chartjs-plugin-datalabels.min.js(v=${buildVersion})}"></script>
<div class="fixed top-0 left-0 right-0 h-1 bg-ink z-40"></div>
<header th:replace="~{fragments/nav :: nav('dashboard', ${me}, ${nav})}"></header>

<main class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-10 py-5 sm:py-10 relative z-10"
      th:with="tocItems=${ { {label:'概览',href:'#dashboard-region'}, {label:'资产洞察',href:'#dash-insight'}, {label:'人赚 vs 钱赚',href:'#dash-cashflow'}, {label:'归因复盘',href:'#dash-attribution'}, {label:'收支趋势',href:'#dash-cashflow-trend'}, {label:'净资产趋势',href:'#dash-trend'}, {label:'按成员分布',href:'#dash-member'}, {label:'按账户分布',href:'#dash-dist'}, {label:'账户列表',href:'#dash-list'}, {label:'资产透视',href:'#lens-section'} } }">

  <!-- v1.6.32 · 新手引导卡(localStorage 一年 · 见 fragments/_manual-hint) -->
  <th:block th:insert="~{fragments/_manual-hint :: card}"></th:block>

  <div class="toc-cols">
    <!--/* v1.22.4 · 目录放在 DOM 【最前】。
           原来它排在主内容之后、靠 order:-1 视觉上放到左列,注释写的是「内容优先」;
           但 HTML 是流式到达的,报表页主内容几十个 section —— 实测目录比主内容晚 0.5~1 秒才出现。
           而目录是【导航】:先到达对屏幕阅读器也更好(能直接跳到想去的节,
           而不是先听完几十个 section),视觉上它本来就在阅读顺序的起点。 */-->
    <th:block th:replace="~{fragments/_toc :: rail(${tocItems})}"></th:block>
    <div class="toc-cols-main">
      <!-- v0.11.6 · 目标进度 + AI洞察 已下移到 region 内「KPI 总览之后」(先看家底再看目标/洞察)· 见 _region.html -->
      <div id="dashboard-region" th:replace="~{dashboard/_region :: region}"></div>
      <!-- v1.1 评审修订:资产透视直接内嵌仪表盘(region 外 · 不随币种镜头 HTMX 重刷 · 本位币口径) -->
      <th:block th:replace="~{lens/_section :: section}"></th:block>
    </div>
    <!-- v0.5.7 · 长文目录共用件 -->
  </div>
  <th:block th:replace="~{fragments/_toc :: mobile(${tocItems})}"></th:block>
</main>
<script th:src="@{/js/toc.js(v=${buildVersion})}"></script>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
