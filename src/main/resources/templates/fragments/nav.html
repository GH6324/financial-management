<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="nav(active, me, state)" class="sticky top-1 bg-paper/95 backdrop-blur border-b border-rule z-30">
  <div class="nav-inner max-w-[1400px] mx-auto px-6 lg:px-10 flex items-center justify-between h-16">
    <div class="nav-lead flex items-center gap-12">
      <a th:href="@{/}" class="flex items-center gap-2.5 no-underline"
         th:with="preset=${state.family.logoPreset != null ? state.family.logoPreset : 'icon2'}">
        <img th:src="${state.family.logoPath != null} ? @{|/uploads/${state.family.logoPath}|} : @{/img/presets/{p}-192.png(p=${preset},v=${buildVersion})}"
             onerror="this.onerror=null;this.src='/img/default-logo.svg'"
             alt="logo" class="w-7 h-7 object-contain"/>
        <span class="nav-brandtext flex flex-col leading-none">
          <span class="flex items-baseline gap-2">
            <span class="font-display text-xl font-medium" th:text="${state.family.brandText}">账房</span>
            <span class="font-mono text-[10px] tracking-[0.2em] text-ink-subtle"
                  th:text="'№ ' + ${#strings.substring(state.family.name, 0, 1)}">№ 张</span>
          </span>
          <!-- 版本号(账册「版次」标记 · brass 细线徽记)· 来源 app.version -->
          <span th:if="${appVersion != null}"
                class="inline-flex items-center gap-1 font-mono text-[9px] tracking-[0.16em] text-brass-deep mt-[3px]">
            <span class="inline-block w-1.5 h-1.5 border border-brass-deep rotate-45" style="opacity:.7"></span>
            <span th:text="'v' + ${appVersion}">v1.4.0</span>
          </span>
        </span>
      </a>
      <nav class="nav-tabs hidden md:flex items-center gap-7 font-mono text-[11px] tracking-[0.14em] uppercase">
        <a th:href="@{/dashboard}" class="no-underline inline-flex items-center gap-1.5"
           th:classappend="${active == 'dashboard' ? ' text-ink border-b-2 border-brass pb-[18px]' : ' text-ink-soft hover:text-ink border-b-2 border-transparent pb-[18px]'}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="shrink-0" aria-hidden="true"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>仪表盘</a>
        <a th:href="@{/entry}" class="no-underline inline-flex items-start"
           th:classappend="${active == 'entry' ? ' text-ink border-b-2 border-brass pb-[18px]' : ' text-ink-soft hover:text-ink border-b-2 border-transparent pb-[18px]'}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="shrink-0 mr-1.5 mt-[2px]" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>填报<span
              class="ml-0.5 -mt-1 px-1 rounded-sm bg-brass-soft text-brass-deep text-[8px] leading-[1.4] tracking-normal normal-case" title="支持 AI 截图导入持仓填报">AI</span>
          <span th:if="${state.pendingCount > 0}" class="ml-1 text-rust" th:text="'·' + ${state.pendingCount}">·2</span></a>
        <a th:href="@{/accounts}" class="no-underline inline-flex items-center gap-1.5"
           th:classappend="${active == 'accounts' ? ' text-ink border-b-2 border-brass pb-[18px]' : ' text-ink-soft hover:text-ink border-b-2 border-transparent pb-[18px]'}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="shrink-0" aria-hidden="true"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20"/></svg>账户</a>
        <a th:href="@{/reports}" class="no-underline inline-flex items-center gap-1.5"
           th:classappend="${active == 'reports' ? ' text-ink border-b-2 border-brass pb-[18px]' : ' text-ink-soft hover:text-ink border-b-2 border-transparent pb-[18px]'}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="shrink-0" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>报表</a>
        <a th:href="@{/goals}" class="no-underline inline-flex items-center gap-1.5"
           th:classappend="${active == 'goals' ? ' text-ink border-b-2 border-brass pb-[18px]' : ' text-ink-soft hover:text-ink border-b-2 border-transparent pb-[18px]'}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="shrink-0" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>目标</a>
        <a th:href="@{/checkup}" class="no-underline inline-flex items-center gap-1.5"
           th:classappend="${active == 'checkup' ? ' text-ink border-b-2 border-brass pb-[18px]' : ' text-ink-soft hover:text-ink border-b-2 border-transparent pb-[18px]'}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="shrink-0" aria-hidden="true"><path d="M20.8 5.6a5.2 5.2 0 0 0-8.8-2.3 5.2 5.2 0 0 0-8.8 2.3c-1 3.7 3.6 8 8.8 12.4 5.2-4.4 9.8-8.7 8.8-12.4Z"/></svg>资产体检</a>
        <a th:href="@{/admin}" class="no-underline inline-flex items-center gap-1.5"
   th:classappend="${active == 'admin' ? ' text-ink border-b-2 border-brass pb-[18px]' : ' text-ink-soft hover:text-ink border-b-2 border-transparent pb-[18px]'}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="shrink-0" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z"/></svg>管理</a>
        <!-- v1.6.32 · 使用手册常驻入口 · 放在主栏最末(用户定:手册不该插在功能项中间)-->
        <a th:href="@{/help/how-to-use}" class="no-underline inline-flex items-center gap-1.5" title="使用手册 · 主流程与分析路径"
           th:classappend="${active == 'help' ? ' text-ink border-b-2 border-brass pb-[18px]' : ' text-ink-soft hover:text-ink border-b-2 border-transparent pb-[18px]'}">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" class="shrink-0" aria-hidden="true">
            <path d="M4 19.5V5a2 2 0 0 1 2-2h13v18H6a2 2 0 0 1-2-1.5Z"/><path d="M8 7h8M8 11h6"/></svg>
          手册
        </a>
      </nav>
    </div>
    <div class="nav-actions flex items-center gap-4">
      <!-- v1.2.2 字号档位(issue #7)· PC 下拉;移动在 ☰ 菜单内。控件本身不缩放,当稳定参照 -->
      <details id="fs-menu" class="relative hidden md:block">
        <summary class="pill pill-mute list-none cursor-pointer inline-flex items-center" style="gap:4px" title="调节字号(看着舒服)" aria-label="调节字号">
          <span style="font-size:14px;line-height:1">A</span><span style="font-size:9px;line-height:1">A</span>
        </summary>
        <div class="absolute right-0 top-full mt-2 bg-card border border-rule shadow-xl z-40 py-1" style="min-width:116px">
          <button type="button" data-fs-opt="std" class="fs-opt" onclick="setFontScale('std');this.closest('details').open=false">标准</button>
          <button type="button" data-fs-opt="lg"  class="fs-opt" onclick="setFontScale('lg');this.closest('details').open=false">大</button>
          <button type="button" data-fs-opt="xl"  class="fs-opt" onclick="setFontScale('xl');this.closest('details').open=false">特大</button>
        </div>
      </details>
      <!-- v0.11 隐私模式 · nav 入口(与浮动控件同步 html.privacy · 零 JS 同步)。PC 显示;移动靠左下浮动控件 -->
      <button type="button" onclick="togglePrivacy()" title="隐藏金额(公共场合 / 分享)" aria-label="隐藏 / 显示金额"
              class="nav-priv pill pill-mute hidden md:inline-flex items-center" style="cursor:pointer;gap:5px">
        <svg class="priv-eye-on" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="priv-eye-off" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      </button>
      <span class="pill pill-brass hidden md:inline-flex" th:text="${state.periodLabel}">2026 · 05 · OPEN</span>
      <span class="font-mono text-[11px] text-ink-soft hidden md:inline" th:text="${me.displayName}">Alice</span>
      <details class="md:hidden relative">
        <summary class="cursor-pointer list-none w-9 h-9 flex items-center justify-center hover:bg-card-soft border border-rule">
          <span class="text-xl leading-none">☰</span>
        </summary>
        <div class="fixed inset-x-0 top-16 bg-card border-y border-rule shadow-xl z-40">
          <nav class="flex flex-col font-mono text-[12px] tracking-[0.14em] uppercase divide-y divide-rule">
            <a th:href="@{/dashboard}" class="px-6 py-4 hover:bg-card-soft no-underline flex items-center gap-3"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="shrink-0" aria-hidden="true"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>仪表盘</a>
            <a th:href="@{/entry}" class="px-6 py-4 hover:bg-card-soft no-underline flex items-center gap-3"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="shrink-0" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>填报<span
                class="ml-1 px-1 rounded-sm bg-brass-soft text-brass-deep text-[9px] tracking-normal normal-case align-middle" title="支持 AI 截图导入持仓填报">AI</span>
              <span th:if="${state.pendingCount > 0}" class="ml-2 text-rust" th:text="'·' + ${state.pendingCount}">·2</span></a>
            <a th:href="@{/accounts}" class="px-6 py-4 hover:bg-card-soft no-underline flex items-center gap-3"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="shrink-0" aria-hidden="true"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20"/></svg>账户</a>
            <a th:href="@{/reports}" class="px-6 py-4 hover:bg-card-soft no-underline flex items-center gap-3"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="shrink-0" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>报表</a>
            <a th:href="@{/goals}" class="px-6 py-4 hover:bg-card-soft no-underline flex items-center gap-3"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="shrink-0" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>目标</a>
            <a th:href="@{/checkup}" class="px-6 py-4 hover:bg-card-soft no-underline flex items-center gap-3"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="shrink-0" aria-hidden="true"><path d="M20.8 5.6a5.2 5.2 0 0 0-8.8-2.3 5.2 5.2 0 0 0-8.8 2.3c-1 3.7 3.6 8 8.8 12.4 5.2-4.4 9.8-8.7 8.8-12.4Z"/></svg>资产体检</a>
            <a th:href="@{/admin}" class="px-6 py-4 hover:bg-card-soft no-underline flex items-center gap-3"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="shrink-0" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8 2 2 0 1 1-2.7 2.7 1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5 2 2 0 1 1-4 0 1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3 2 2 0 1 1-2.7-2.7 1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1 2 2 0 1 1 0-4 1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8 2 2 0 1 1 2.7-2.7 1.6 1.6 0 0 0 1.8.3 1.6 1.6 0 0 0 1-1.5 2 2 0 1 1 4 0 1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3 2 2 0 1 1 2.7 2.7 1.6 1.6 0 0 0-.3 1.8 1.6 1.6 0 0 0 1.5 1 2 2 0 1 1 0 4 1.6 1.6 0 0 0-1.5 1Z"/></svg>管理</a>
            <a th:href="@{/help/how-to-use}" class="px-6 py-4 hover:bg-card-soft no-underline flex items-center gap-3"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="shrink-0" aria-hidden="true"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v18H6a2 2 0 0 1-2-1.5Z"/><path d="M8 7h8M8 11h6"/></svg>使用手册</a>
            <form th:if="${_csrf != null}" th:action="@{/logout}" method="post" class="px-6 py-4 bg-card-soft">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <button class="font-mono text-[12px] tracking-[0.14em] uppercase">退出</button>
            </form>
            <!-- v1.2.2 字号档位(issue #7)· 移动端入口 -->
            <div class="px-6 py-3 flex items-center gap-2 flex-wrap normal-case tracking-normal">
              <span class="font-mono text-[11px] text-ink-subtle mr-1">字号</span>
              <button type="button" data-fs-opt="std" class="fs-opt-m" onclick="setFontScale('std')">标准</button>
              <button type="button" data-fs-opt="lg"  class="fs-opt-m" onclick="setFontScale('lg')">大</button>
              <button type="button" data-fs-opt="xl"  class="fs-opt-m" onclick="setFontScale('xl')">特大</button>
            </div>
            <div class="px-6 py-3 bg-card-soft text-ink-subtle text-[10px]"
                 th:text="'─ 当前 · ' + ${me.displayName} + ' · ' + ${state.periodLabel}">─ 当前 · Alice · OPEN</div>
          </nav>
        </div>
      </details>
      <div class="w-8 h-8 rounded-full bg-ink text-paper flex items-center justify-center font-display text-sm"
           th:text="${#strings.substring(me.displayName, 0, 1)}">伟</div>
      <form th:if="${_csrf != null}" th:action="@{/logout}" method="post" class="hidden md:inline">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="btn-ghost">退出</button>
      </form>
    </div>
  </div>
</header>
</body>
</html>
