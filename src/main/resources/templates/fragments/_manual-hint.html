<!--
  新手引导卡 · v1.6.32(issue #9)

  用户定的策略:第一次用要**很醒目**,用过之后也要**保留入口**。
  醒目卡走 localStorage,有效期 1 年(用户拍板:不用服务端状态,前端存着就行)。
  代价是**每台设备各提示一次**(手机 / 电脑各一遍)、清缓存会再来 —— 对「第一次用」的提示可以接受。

  防闪(FOUC):卡片默认 display:none,由脚本判定后才显示。
  反过来做(默认显示、脚本再隐藏)会让老用户每次进页面都闪一下卡片,比不做还糟。
-->
<th:block th:fragment="card">
  <div id="manualHint" class="paper-card mb-5" style="display:none;border-left:3px solid var(--brass-deep);padding:18px 20px">
    <div class="flex items-start justify-between gap-4 flex-wrap">
      <div style="min-width:250px;flex:1">
        <div class="flex items-center gap-2 mb-1.5">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" style="color:var(--brass-deep)">
            <path d="M4 19.5V5a2 2 0 0 1 2-2h13v18H6a2 2 0 0 1-2-1.5Z"/><path d="M8 7h8M8 11h6"/></svg>
          <h3 class="font-display text-lg sm:text-xl font-medium">第一次用?十分钟走通一个月</h3>
        </div>
        <p class="text-sm text-ink-soft mb-3" style="line-height:1.85">
          这个软件<b class="text-ink">不用记流水</b> —— 每月只做四件事:
          <b class="text-ink">录收入 → 填支出 → 核余额 → 关账</b>。
          手册里有带演示的完整流程,以及「怎么从全貌钻到具体某一笔」。
        </p>
        <div class="flex items-center gap-3 flex-wrap">
          <a th:href="@{/help/how-to-use}" class="btn-ink no-underline inline-flex items-center gap-1.5"
             data-manual-open>
            打开使用手册
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </a>
          <button type="button" class="btn-paper text-[11px]" data-manual-dismiss>知道了</button>
          <span class="font-mono text-[10px] text-ink-subtle">约 4 分钟读完</span>
        </div>
      </div>
      <div class="font-mono text-ink-subtle" style="font-size:10px;line-height:1.9;max-width:200px;
                  border-left:1px solid var(--rule-soft);padding-left:14px">
        点「知道了」后一年内不再显示<br>
        <span style="color:var(--brass-text)">入口一直保留在导航栏「手册」</span>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var KEY = 'manualHintDismissedAt', YEAR = 365 * 24 * 3600 * 1000;
      var el = document.getElementById('manualHint');
      if (!el) return;
      var at = 0;
      try { at = Number(localStorage.getItem(KEY) || 0); } catch (e) { at = 0; }
      // 存的时间戳非法 / 是未来时间 → 当作没看过(防手改坏值后永远不提示)
      if (!(at > 0) || at > Date.now()) at = 0;
      if (at && Date.now() - at < YEAR) return;      // 一年内看过 → 保持隐藏
      el.style.display = '';
      function mark() { try { localStorage.setItem(KEY, String(Date.now())); } catch (e) {} }
      el.querySelectorAll('[data-manual-dismiss]').forEach(function (b) {
        b.addEventListener('click', function () { mark(); el.style.display = 'none'; });
      });
      // 点进手册也算「已引导」——已经去看了,没必要下次再拦一遍
      el.querySelectorAll('[data-manual-open]').forEach(function (a) {
        a.addEventListener('click', mark);
      });
    })();
  </script>
</th:block>
