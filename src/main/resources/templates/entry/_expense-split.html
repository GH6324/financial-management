<!--/*
  v1.21 · 分类填报(TOTAL 模式的「展开态」)。

  这一片段的存在前提是 PRD 的中心决定:**分类是月度总额的展开,不是第三种记账方式**。
  所以这里没有「保存分类」和「保存总额」两个按钮 —— 只有一个,合计自动写回月度总额。

  零影响:整块挂在「这个家建过类目」之后。没建类目的家庭,这一段一个像素都不渲染。
*/-->
<th:block th:fragment="region">

  <!--/* ═══ 收起态:只给一个入口。不拆的人永远停在这里 ═══ */-->
  <div th:if="${splitCategories != null and !#lists.isEmpty(splitCategories) and !splitOpen}"
       class="border-t border-rule-soft pt-4 mt-4">
    <form th:action="@{/entry/split/open}" method="post" class="flex flex-wrap items-baseline gap-3">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <input type="hidden" name="periodId" th:value="${period.id}">
      <button type="submit" class="font-mono text-[11px] text-brass-deep hover:underline bg-transparent border-0 cursor-pointer p-0">
        拆开按类目填 →
      </button>
      <span class="text-[11.5px] text-ink-subtle">
        多花一两分钟,换来「钱花在哪」。从支付宝/微信的月账单照抄即可,<b>不用在这里记流水</b>。
      </span>
    </form>
  </div>

  <!--/* ═══ 还没建类目:给一句话 + 去建的入口。只在支出区出现一次,不啰嗦 ═══ */-->
  <div th:if="${splitCategories == null or #lists.isEmpty(splitCategories)}"
       class="border-t border-rule-soft pt-4 mt-4">
    <a th:href="@{/expense/categories}" class="font-mono text-[11px] text-brass-deep hover:underline no-underline">
      想知道钱花在哪?建几个支出类目 →
    </a>
    <span class="text-[11.5px] text-ink-subtle ml-2">流水账留在支付宝/微信里,这边只填按类目的汇总数。</span>
  </div>

  <!--/* ═══ 展开态 ═══ */-->
  <div th:if="${splitOpen and splitCategories != null and !#lists.isEmpty(splitCategories)}"
       class="border-t border-rule-soft pt-5 mt-4">
    <form th:action="@{/entry/split}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <input type="hidden" name="periodId" th:value="${period.id}">

      <div class="flex items-baseline gap-2 mb-1 flex-wrap">
        <span class="pill" style="background:rgba(159,74,58,.10);color:var(--rust);border-color:var(--rust)">支出</span>
        <span class="font-mono text-[10px] text-ink-subtle">
          按类目填 · <span th:text="${splitDeep} ? '细类' : '大类'">大类</span>
        </span>
        <a th:href="@{/expense/import(periodId=${period.id})}"
           class="font-mono text-[10px] text-brass-deep hover:underline no-underline">从账单导入 →</a>
        <a th:href="@{/expense/categories}"
           class="font-mono text-[10px] text-ink-subtle hover:underline no-underline">管理支出类目</a>
      </div>
      <p class="text-[11.5px] text-ink-subtle mb-4">合计会自动写回你的月度总额 —— 拆不拆,家庭的大账都一样。</p>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-8 gap-y-1">
        <div th:each="c : ${splitCategories}" class="py-1.5 border-b border-rule-soft/60">
          <label class="flex items-center gap-3 flex-wrap">
            <!--/* 复杂深度下,钱记在大类上时标「未细分」—— 它不是一个真类目,
                   是「记在大类上的钱」的叫法。不标的话用户会以为多了个同名类目。 */-->
            <span class="text-[12.5px]" style="min-width:6.5em"
                  th:text="${splitUnsplitIds != null and splitUnsplitIds.contains(c.id)
                            ? c.name + ' · 未细分' : c.name}">餐饮美食</span>
            <input type="number" step="0.01" min="0" max="99999999"
                   th:name="'cat_' + ${c.id}"
                   th:value="${splitCells != null and splitCells.get(c.id) != null
                              ? splitCells.get(c.id).total() : null}"
                   th:placeholder="${splitPrev != null and splitPrev.get(c.id) != null
                              ? '上月 ¥' + #numbers.formatInteger(splitPrev.get(c.id), 0, 'COMMA') : '0'}"
                   class="w-32 h-9 font-mono text-[13px] bg-paper border border-rule px-2 tnum text-right">
            <span th:if="${c.isOther()}" class="font-mono text-[9px] text-ink-subtle">懒得拆的塞这里</span>
          </label>
          <!--/* 来源构成角标 —— 让用户知道这个数是谁给的,以及「改这个框改的是手工那一份」。
                 没有导入过的类目不显示,免得每行都挂一句废话。 */-->
          <div th:if="${splitCells != null and splitCells.get(c.id) != null
                       and splitCells.get(c.id).imported().signum() != 0}"
               class="font-mono text-[9px] text-ink-subtle mt-0.5" style="padding-left:6.5em">
            <span th:each="s,i : ${splitCells.get(c.id).bySource()}"
                  th:text="${(i.index > 0 ? ' · ' : '') + s.key.label + ' ' + #numbers.formatInteger(s.value, 0, 'COMMA')}">支付宝 2,180</span>
            <span class="text-ink-subtle"> · 改这个框 = 改手工那一份</span>
          </div>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-4 mt-5 pt-4 border-t-2 border-brass-deep">
        <span class="font-mono text-[10px] uppercase text-ink-subtle">合计(自动写回月度总额)</span>
        <span class="font-display text-xl tnum" data-priv id="splitSum"
              th:text="'¥' + ${#numbers.formatInteger(splitTotal ?: 0, 0, 'COMMA')}">¥0</span>
        <button type="submit" class="btn-ink text-sm h-11 px-4">保存</button>
        <span style="flex:1"></span>
        <button type="submit" formnovalidate th:formaction="@{/entry/split/collapse}"
                class="font-mono text-[10px] text-ink-subtle hover:underline bg-transparent border-0 cursor-pointer"
                onclick="return confirm('并回一个总数?分类明细会清掉,但本月总额留着 —— 你要的是「不再拆」,不是「这个月没花钱」。')">
          并回一个总数
        </button>
      </div>
    </form>

    <script>
      /* 合计随输入实时更新 —— 用户抄账单时要能立刻对上账单上的总数,
         不然得点一次保存才知道抄错没有。纯展示,权威值仍由服务端重算。 */
      (function () {
        var form = document.currentScript.closest('div').querySelector('form');
        if (!form) return;
        var out = document.getElementById('splitSum');
        function recalc() {
          var s = 0;
          form.querySelectorAll('input[type=number]').forEach(function (i) {
            var v = parseFloat(i.value);
            if (!isNaN(v)) s += v;
          });
          if (out) out.textContent = '¥' + Math.round(s).toLocaleString('en-US');
        }
        form.addEventListener('input', recalc);
      })();
    </script>
  </div>
</th:block>
