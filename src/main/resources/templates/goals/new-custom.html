<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${editing} ? '编辑自定义目标' : '新建自定义追踪目标')}"></head>
<body class="min-h-screen relative">
<div class="fixed top-0 left-0 right-0 h-1 bg-ink z-40"></div>
<header th:replace="~{fragments/nav :: nav('goals', ${me}, ${nav})}"></header>

<main class="max-w-[900px] mx-auto px-4 sm:px-6 lg:px-10 py-5 sm:py-10 relative z-10">
  <div class="font-mono text-[10px] tracking-[0.18em] uppercase text-ink-subtle mb-4">
    <a th:href="@{/goals}" class="hover:text-ink no-underline">目标</a>
    <span class="mx-2 text-rule">/</span><span class="text-ink" th:text="${editing} ? '编辑自定义目标' : '新建自定义追踪目标'">自定义追踪</span>
  </div>

  <div class="mb-6">
    <div class="font-mono text-[10px] tracking-[0.18em] uppercase text-brass-deep mb-1">自 · 定 · 义 · 追 · 踪</div>
    <h1 class="font-display text-3xl font-medium tracking-tight">绑账户 · 选指标 · 定目标 · 设期限</h1>
    <p class="text-sm text-ink-soft mt-1">如「1 年内现金到 20 万」「某 3 个账户合计年化到 20%」。只读追踪,不动你的钱。</p>
  </div>

  <form th:action="${editing} ? @{|/goals/${goal.id}/edit-custom|} : @{/goals/new/custom}" method="post" class="paper-card p-6 space-y-6">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

    <!-- 名称 + 可选描述 -->
    <div>
      <label class="field-label">目标名称</label>
      <input name="name" class="field-input" th:value="${editing} ? ${goal.name} : ''" placeholder="如 今年现金冲刺">
    </div>
    <div>
      <label class="field-label">描述(可选)</label>
      <textarea name="description" rows="2" class="field-input" placeholder="给这个目标写点备注,如「攒够首付就出手」" th:text="${editing} ? ${goal.description} : ''"></textarea>
    </div>

    <!-- ① 绑定账户(0..N · 先选账户再选指标)-->
    <div>
      <label class="field-label">① 绑定账户(多选 · 不选 = 全家)</label>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
        <label th:each="a : ${accounts}" class="flex items-center gap-2 text-sm cursor-pointer border border-rule px-2 py-1.5">
          <input type="checkbox" name="accountIds" class="accent-brass-deep" th:value="${a.id}"
                 th:checked="${boundIds != null and #lists.contains(boundIds, a.id)}">
          <span th:text="${a.displayName}">账户</span>
          <span class="pill text-[9px] ml-auto" th:text="${a.type}">CASH</span>
        </label>
      </div>
      <p class="font-mono text-[10px] text-ink-subtle mt-1" th:if="${#lists.isEmpty(accounts)}">还没有账户;不选账户则按全家口径追踪。</p>
    </div>

    <!-- ② 追踪指标(分组)-->
    <div>
      <label class="field-label">② 追踪指标</label>
      <div class="font-mono text-[10px] text-ink-subtle mb-1">金额类 · 支持进度 vs 时间落后判定</div>
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 mb-3">
        <label th:each="m : ${metrics}" th:if="${m.kind().name() == 'AMOUNT'}" class="flex items-center gap-1.5 text-sm cursor-pointer border border-rule px-2 py-1.5">
          <input type="radio" name="metric" class="accent-brass-deep" th:value="${m.name()}"
                 th:checked="${(editing and goal.metric != null and goal.metric.name() == m.name()) or ((!editing or goal.metric == null) and m.name() == 'AMOUNT_TOTAL')}">
          <span th:text="${m.label()}">金额合计</span>
        </label>
      </div>
      <div class="font-mono text-[10px] text-ink-subtle mb-1">比率类 · 仅倒计时(不做落后硬判)</div>
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 mb-3">
        <label th:each="m : ${metrics}" th:if="${m.kind().name() == 'RATE'}" class="flex items-center gap-1.5 text-sm cursor-pointer border border-rule px-2 py-1.5">
          <input type="radio" name="metric" class="accent-brass-deep" th:value="${m.name()}"
                 th:checked="${editing and goal.metric != null and goal.metric.name() == m.name()}">
          <span th:text="${m.label()}">年化收益率</span>
        </label>
      </div>
      <div class="font-mono text-[10px] text-ink-subtle mb-1">月数 / 其它(仅全家口径 · 建议不选账户)</div>
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
        <label th:each="m : ${metrics}" th:if="${m.kind().name() == 'MONTHS'}" class="flex items-center gap-1.5 text-sm cursor-pointer border border-rule px-2 py-1.5">
          <input type="radio" name="metric" class="accent-brass-deep" th:value="${m.name()}"
                 th:checked="${editing and goal.metric != null and goal.metric.name() == m.name()}">
          <span th:text="${m.label()}">紧急储备月数</span>
        </label>
      </div>
      <p class="font-mono text-[10px] text-ink-subtle mt-2">金额类:Σ 上面所选账户本位币(贷款计负)· 不选账户 = 全家对应总量。比率类:所选账户价值加权,只对可算收益账户有意义。</p>
    </div>

    <!-- ③ 目标值 + 达标方向 -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label class="field-label">③ 目标值(金额填数额;收益率填百分数,如 20)</label>
        <input name="targetValue" type="number" step="0.01" class="field-input" th:value="${editing} ? ${goal.targetValue} : ''" placeholder="200000">
      </div>
      <div>
        <label class="field-label">达标方向</label>
        <select name="comparator" class="field-input bg-transparent">
          <option value="GTE" th:selected="${!editing or goal.comparator == null or goal.comparator.name() == 'GTE'}">≥ 达到(增长类)</option>
          <option value="LTE" th:selected="${editing and goal.comparator != null and goal.comparator.name() == 'LTE'}">≤ 降到(负债/回撤类)</option>
        </select>
      </div>
    </div>

    <!-- ④ 时间范围 -->
    <div>
      <label class="field-label">④ 时间范围</label>
      <div class="flex flex-wrap gap-2 mb-2" th:with="dl=${editing and goal.timeMode != null and goal.timeMode.name() == 'DEADLINE'}">
        <label class="flex items-center gap-1.5 text-sm cursor-pointer border border-rule px-3 py-1.5"><input type="radio" name="timeRange" value="ONE_YEAR" class="accent-brass-deep"> 1 年内</label>
        <label class="flex items-center gap-1.5 text-sm cursor-pointer border border-rule px-3 py-1.5"><input type="radio" name="timeRange" value="THREE_YEAR" class="accent-brass-deep"> 3 年内</label>
        <label class="flex items-center gap-1.5 text-sm cursor-pointer border border-rule px-3 py-1.5"><input type="radio" name="timeRange" value="FIVE_YEAR" class="accent-brass-deep"> 5 年内</label>
        <label class="flex items-center gap-1.5 text-sm cursor-pointer border border-rule px-3 py-1.5"><input type="radio" name="timeRange" value="CUSTOM" id="trCustom" class="accent-brass-deep" th:checked="${dl}"> 自定义日期</label>
        <label class="flex items-center gap-1.5 text-sm cursor-pointer border border-rule px-3 py-1.5"><input type="radio" name="timeRange" value="OPEN" class="accent-brass-deep" th:checked="${!dl}"> 长期(不设期限)</label>
      </div>
      <input name="customDate" type="date" id="customDate" class="field-input" style="max-width:220px"
             th:value="${editing and goal.targetDate != null} ? ${goal.targetDate} : ''">
      <p class="font-mono text-[10px] text-ink-subtle mt-1">选 1/3/5 年自动生成截止日;长期型不做时间落后判定(仅显示当前值)。</p>
    </div>

    <div class="flex gap-3 pt-2">
      <button type="submit" class="btn-ink" th:text="${editing} ? '保存修改' : '创建目标'">创建目标</button>
      <a th:href="@{/goals}" class="btn-paper no-underline">取消</a>
    </div>
  </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:inline="none">
(function(){
  var custom = document.getElementById('customDate');
  function sync(){
    var v = document.querySelector('input[name="timeRange"]:checked');
    if(custom) custom.style.display = (v && v.value === 'CUSTOM') ? '' : 'none';
  }
  document.querySelectorAll('input[name="timeRange"]').forEach(function(r){ r.addEventListener('change', sync); });
  sync();
})();
</script>
</body>
</html>
