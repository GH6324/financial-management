<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<!--
  v1.19 · 问一问 · 对话流(唯一一份)

  PC 抽屉与手机整页**共用这个片段**,差别只在外面那层容器 —— 维护者的判断:
  「就是一个 sse 的对话流,那有必要区分移动端或者 PC 端嘛?」
  护栏 v119-ASK-TWO-SHELLS 钉住这条:两种壳必须 th:replace 到同一个 fragment。

  版式取自 Claude / ChatGPT / Manus 已经收敛的那套规范,但**视觉语言仍是账房自己的**
  (纸色底、铜色强调、eyebrow 字距)—— 照搬中性灰白会让这一页看着像从别的产品抄来的。
  照搬的是结构:
    · **不用气泡**。圆角实心气泡传递的是「随便聊聊」,削弱工具感;改成扁平 + 右对齐 + 细下划线。
    · 正文列宽收到 768,行高 1.75 —— 中文一行约 40 字,长回答读起来才不累。
    · 工具执行过程**默认折叠**(Manus 那条:对话讲结论,活动另放)。
    · 流式期间给光标,收尾给「复制 / 重来 / 追问」,进行中给「停止」。
-->
<body>

<div th:fragment="stream(conv, messages, presets, blocked, runtimeLabel, ctxLabel, recent)"
     class="ask-stream flex-1 flex flex-col min-h-0"
     th:attr="data-conv=${conv != null ? conv.id : ''}">

  <!-- 不可用:说清楚为什么、去哪儿开,不是一句「暂不可用」 -->
  <div th:if="${blocked != null}" class="ask-blocked">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <div>
      <div th:text="${blocked}">还没打开</div>
      <a th:href="@{/admin/ai-access}">去设置 →</a>
    </div>
  </div>

  <!-- ══ 消息区 ══ -->
  <div class="ask-msgs" data-ask-msgs aria-live="polite" aria-atomic="false">
    <div class="ask-col">

      <!-- 空态:输入优先 —— 居中一句话 + 几条可点的问题。
           非技术家庭成员点一下就能开始,不用先想「该问什么」。 -->
      <!-- 顶栏已经有「问 · 一 · 问」了,这里不再重复一遍品牌字 -->
      <div th:if="${messages == null or #lists.isEmpty(messages)}" class="ask-empty">
        <p class="ask-empty-lead">用大白话问你自己的账。</p>
        <p class="ask-empty-sub">数字都从你录的数据里来,每个数字都能点回原页核对。</p>

        <div class="ask-presets">
          <button th:each="p : ${presets}" th:text="${p}" th:attr="data-ask-preset=${p}"
                  type="button" class="ask-preset">预置问题</button>
        </div>

        <!-- 历史放在空态里,不做成常驻的兄弟块:常驻会从对话区抢走高度(手机上抢掉 214px,
             输入框因此浮在半页中间),而且开着对话时它只是干扰。 -->
        <div th:if="${not #lists.isEmpty(recent)}" class="ask-recent">
          <div class="eyebrow">最 近</div>
          <div class="ask-recent-list">
            <a th:each="c : ${recent}" th:href="@{/ask(conv=${c.id})}" th:text="${c.title}">对话</a>
          </div>
        </div>
      </div>

      <!-- 历史消息 -->
      <div th:each="m : ${messages}" th:switch="${m.role}">

        <!-- 用户:右对齐 + 细下划线,**不用气泡** -->
        <div th:case="'user'" class="ask-me">
          <div th:text="${m.contentText}">提问</div>
        </div>

        <!-- 旁白:换账期、上游出错、已叫停。样式刻意弱,它不是答案 -->
        <div th:case="'system_note'" class="ask-note"><span th:text="${m.contentText}">旁白</span></div>

        <div th:case="*" class="ask-turn">
          <!-- 工具执行:默认折叠成一行。展开才逐条列 —— 对话区讲结论,过程别抢注意力 -->
          <details th:if="${not #lists.isEmpty(m.toolCalls)}" class="ask-acts">
            <summary>
              <span class="ask-caret" aria-hidden="true">▸</span>
              <span th:text="'查了 ' + ${#lists.size(m.toolCalls)} + ' 项'">查了 N 项</span>
            </summary>
            <div class="ask-acts-body">
              <div th:each="t : ${m.toolCalls}" class="ask-act">
                <span class="ask-dot" th:classappend="${t.ok} ? '' : ' bad'"></span>
                <span th:text="${t.label}">工具</span>
                <span class="ask-act-ms" th:text="${t.ok} ? ${t.durationMs} + ' ms' : '没查到'">-</span>
              </div>
            </div>
          </details>

          <div class="ask-body" th:utext="${renderer.renderHtml(m.contentText, m.citations)}">正文</div>

          <!-- 追问 chip · FR-424b:回答之后给 2–3 条,点一下就等于把那句话问出来。
               th:with 必须放在**外层** —— Thymeleaf 的属性优先级里 th:if(300)先于 th:with(500),
               写在同一个标签上时条件会在变量赋值之前求值,永远拿到 null(实测:chip 一个都不出)。 -->
          <th:block th:with="nexts=${renderer.nextQuestions(m.contentText)}">
            <div th:if="${not #lists.isEmpty(nexts)}" class="ask-nexts">
              <button th:each="n : ${nexts}" th:text="${n}" th:attr="data-ask-preset=${n}"
                      type="button" class="ask-next">追问</button>
            </div>
          </th:block>

          <div class="ask-tools-row">
            <button type="button" class="ask-mini" data-ask-copy
                    th:attr="data-text=${renderer.plainText(m.contentText, m.citations)}">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>复制
            </button>
            <button type="button" class="ask-mini" data-ask-regen>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>重来
            </button>
          </div>
        </div>
      </div>

      <!-- 本轮流式输出挂载点 -->
      <div data-ask-live></div>
    </div>
  </div>

  <!-- ══ 输入区 ══ 必须贴底:浮动的输入框盖住最后一条消息,是这类界面最常见的手机端 bug -->
  <div class="ask-composer-wrap" th:classappend="${blocked != null} ? ' is-off'">
    <div class="ask-col">
      <form class="ask-composer" data-ask-form>
        <textarea data-ask-input rows="1" maxlength="500" placeholder="问点什么…"
                  aria-label="提问"></textarea>
        <button type="submit" data-ask-send aria-label="发送" title="发送">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
        <!-- 停止:流式期间顶替发送键。用户常在半句话之内就知道方向错了 -->
        <button type="button" data-ask-stop aria-label="停止" title="停止" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
        </button>
      </form>
      <div class="ask-foot">
        <span th:text="${ctxLabel}">2026-08 · CNY</span>
        <span class="ask-foot-sep">·</span>
        <span th:text="${runtimeLabel}">本机直连</span>
        <span class="ask-foot-sep">·</span>
        <span>数字来自你自己的账</span>
      </div>
    </div>
  </div>
</div>

</body>
</html>
