<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* v1.27 · 「记住这条分析偏好?」确认卡(PRD FR-854 / FR-849 · preview 第 11 区)。
       只有用户点了「记住」才保存 —— AI 自己存不了。说的是分析角度时再给「切到某个内置模板」「基于当前模板定制」;
       说的是「别算某个资产」时再给「把 X 标成不参与配置分析 →」(偏好改不了数字,标记才能让体检卡片和规则也不算它)。
       表单由 ask.js 接管成异步提交,整张卡换成「已记住」那一行;没脚本时照常提交也能存。 */-->
<div th:fragment="card" th:if="${rc != null}" class="remember-card" data-remember-card>
  <div class="flex items-baseline gap-2 flex-wrap">
    <span class="rc-t">记住这条分析偏好?</span>
    <span class="text-[11.5px] text-ink-subtle">以后所有 AI 分析都会参考它</span>
  </div>
  <form th:action="@{/ask/remember}" method="post" data-remember-form>
    <textarea name="text" rows="2" maxlength="200" th:text="${rc.proposal().text()}" aria-label="要记住的原文">房子是自住的,别建议卖。</textarea>
    <div class="rc-acts">
      <button type="submit" class="btn-ink text-xs" data-remember-save>记住</button>
      <button type="button" class="btn-line" data-remember-dismiss>不用</button>
      <span class="text-[11px] text-ink-subtle ml-auto">原文可以改了再记</span>
    </div>
  </form>
  <div th:if="${rc.showMore()}" class="rc-more-wrap">
    <div class="text-[11.5px] text-ink-subtle mt-3" th:text="${rc.proposal().suggestsTemplate()} ? '这句说的是分析角度,还可以:' : '还可以:'">这句说的是分析角度,还可以:</div>
    <div class="rc-more" style="border-top:0;margin-top:6px;padding-top:0">
      <form th:if="${rc.proposal().suggestsTemplate()}" th:action="@{/ask/remember/template}" method="post" data-remember-form class="contents">
        <input type="hidden" name="key" th:value="${rc.proposal().templateKey()}"/>
        <button type="submit" class="btn-line" data-remember-template th:text="'切到「' + ${rc.proposal().templateName()} + '」'">切到「稳健守护」</button>
      </form>
      <a th:if="${rc.proposal().suggestsTemplate()}" th:href="${rc.customizeUrl()}" class="btn-line" data-remember-customize>基于当前模板定制 →</a>
      <a th:if="${rc.proposal().suggestsExclude()}" data-remember-exclude class="btn-line"
         th:href="${rc.excludeAccountId() != null} ? @{|/accounts/${rc.excludeAccountId()}/edit|} + '#analysis-excluded' : @{/admin/analysis} + '#excluded'"
         th:text="${rc.excludeAccountName() != null} ? '把「' + ${rc.excludeAccountName()} + '」标成不参与配置分析 →' : '把它标成不参与配置分析 →'">把自住房标成不参与配置分析 →</a>
    </div>
  </div>
</div>

<!--/* 点完之后整张卡换成这一行 */-->
<div th:fragment="done" class="remember-card" style="padding:9px 13px" data-remember-done>
  <span th:if="${doneText != null}" class="text-[12.5px]" th:text="${doneText}">已记住 · 以后所有 AI 分析都会参考它</span>
  <span th:if="${doneError != null}" class="text-[12.5px] text-rust" th:text="${doneError}">出错了</span>
  <span class="text-ink-subtle">·</span>
  <a th:href="@{/admin/analysis} + '#preferences'" class="text-[12.5px] text-brass-deep underline" data-remember-manage>在分析设置里管理 →</a>
</div>
</body>
</html>
