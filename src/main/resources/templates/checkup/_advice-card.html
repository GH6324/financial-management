<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 单张 advice 卡片 fragment · v0.2 FR-40c -->
<article th:fragment="card(advice)" class="paper-card p-5 advice-card"
         th:attr="data-rule=${advice.ruleId()},data-severity=${advice.severity().name()},data-account=${advice.accountId()}"
         th:style="${
            advice.severity().name() == 'DANGER' ? 'border-left: 4px solid var(--rust); background: linear-gradient(180deg, rgba(159,74,58,.05) 0%, var(--card) 60%);' :
            advice.severity().name() == 'WARN'   ? 'border-left: 4px solid var(--brass-deep); background: linear-gradient(180deg, rgba(122,90,57,.04) 0%, var(--card) 60%);' :
            advice.severity().name() == 'OK'     ? 'border-left: 4px solid var(--forest); background: linear-gradient(180deg, rgba(47,93,80,.04) 0%, var(--card) 60%);' :
                                                  'border-left: 4px solid var(--ink-subtle);'
         }">
  <div class="flex items-baseline justify-between mb-2">
    <span class="font-mono text-[10px] tracking-[0.18em] uppercase font-medium"
          th:style="${
             advice.severity().name() == 'DANGER' ? 'color:var(--rust)' :
             advice.severity().name() == 'WARN'   ? 'color:var(--brass-deep)' :
             advice.severity().name() == 'OK'     ? 'color:var(--forest)' :
                                                   'color:var(--ink-soft)'
          }"
          th:text="${advice.category()}">集中度告警</span>
    <span class="font-mono text-[9px] uppercase text-ink-subtle" th:text="${advice.ruleId()}">RET-3</span>
  </div>
  <h4 class="font-display text-lg font-medium mb-2" th:text="${advice.rawTitle()}">建议标题</h4>
  <p class="text-sm text-ink-soft leading-relaxed mb-3" th:text="${advice.rawBody()}">建议正文</p>

  <div class="flex items-center gap-2 mt-3 pt-3 border-t border-rule-soft">
    <a th:if="${advice.cta() != null}"
       th:href="${advice.accountId() != null ? '/checkup?account=' + advice.accountId() : '/checkup'}"
       class="text-[11px] font-mono px-2.5 py-1 border border-ink bg-ink text-paper no-underline"
       th:text="${advice.cta()}">→ 行动</a>
    <!--/* issue #22 · 这个按钮从 v0.2 起就调用一个【不存在的】前端函数 advice.dismiss(…),
           后端也从没有对应的接口 —— 点了浏览器报 advice is not defined,页面上什么都不发生。
           改成普通表单提交:不依赖任何脚本,脚本挂了也照样能用;存进家庭配置,换设备、换人都生效。 */-->
    <form th:action="@{/checkup/advice/dismiss}" method="post" class="ml-auto">
      <input type="hidden" name="ruleId" th:value="${advice.ruleId()}"/>
      <input type="hidden" name="accountId" th:if="${advice.accountId() != null}" th:value="${advice.accountId()}"/>
      <button type="submit" class="text-[11px] font-mono px-2.5 py-1 text-ink-subtle hover:text-ink inline-flex items-center gap-1"
              title="标成不适用后这条提醒不再显示;页面下方可以一键恢复">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        不适用
      </button>
    </form>
  </div>
</article>

<!-- empty 占位 -->
<div th:fragment="empty"></div>

<!--/* issue #22 · 被标成「不适用」的提醒:说清藏了几条,并且能一键恢复(点错了能撤回)。
       hidden = 0 时整块不出现。accountId 为空 = 家庭页(只恢复家庭级的)。 */-->
<div th:fragment="restore(hidden, accountId)" th:if="${hidden != null and hidden > 0}"
     class="mt-3 flex items-center gap-2 text-[11.5px] text-ink-subtle">
  <span th:text="|已隐藏 ${hidden} 条标成「不适用」的提醒|">已隐藏 1 条标成「不适用」的提醒</span>
  <span>·</span>
  <form th:action="@{/checkup/advice/restore}" method="post" class="inline">
    <input type="hidden" name="accountId" th:if="${accountId != null}" th:value="${accountId}"/>
    <button type="submit" class="text-brass-deep underline underline-offset-2">全部恢复</button>
  </form>
</div>
</body>
</html>
